<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pixiv Following Downloader">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#12B5FF"/>
      <stop offset="0.55" stop-color="#0096FA"/>
      <stop offset="1" stop-color="#0053D6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#003B9E" flood-opacity="0.35"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.16"/></feComponentTransfer>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="118" cy="92" r="150" fill="#FFFFFF" opacity="0.24"/>
    <circle cx="430" cy="438" r="180" fill="#8FE4FF" opacity="0.28"/>
    <circle cx="360" cy="110" r="90" fill="#FFFFFF" opacity="0.12"/>
  </g>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#shine)"/>
  <rect x="25" y="25" width="462" height="462" rx="108" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Pixiv 风格的小写 p -->
  <path fill="#FFFFFF" fill-rule="evenodd" filter="url(#soft)"
        d="M 170 120 H 276 A 96 96 0 0 1 276 312 H 240 V 384 H 170 Z
           M 284 168 A 44 44 0 1 0 284 256 A 44 44 0 1 0 284 168 Z"/>

  <!-- 毛玻璃下载按钮 -->
  <circle cx="400" cy="400" r="62" fill="#FFFFFF" fill-opacity="0.16"/>
  <circle cx="400" cy="400" r="62" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3"/>
  <path d="M 400 366 V 416" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
  <path d="M 376 394 L 400 418 L 424 394" fill="none" stroke="#FFFFFF" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="16" y="16" width="480" height="480" rx="116" filter="url(#grain)"
        opacity="0.55" style="mix-blend-mode:overlay"/>
</svg>
