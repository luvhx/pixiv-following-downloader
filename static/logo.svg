<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pixiv Following Downloader">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="0.52" stop-color="#6D6BFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#18205A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#shine)"/>
  <rect x="35" y="35" width="442" height="442" rx="105" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"/>

  <!-- 白色几何 P：Pixiv 的首字母 -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="M 170 124 H 292 A 102 102 0 0 1 292 328 H 170 Z M 292 184 A 42 42 0 1 1 292 268 A 42 42 0 1 1 292 184 Z"/>
  <rect x="170" y="124" width="58" height="250" rx="29" fill="#FFFFFF"/>

  <!-- 粉色下载箭头：跟随 + 下载 -->
  <path fill="#FF5D8F" d="M 132 348 H 266 L 199 448 Z"/>
</svg>
